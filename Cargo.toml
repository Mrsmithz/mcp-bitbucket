[package]
name = "mcp-bitbucket"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[dependencies]
anyhow = "1"
futures-util = "0.3"
base64 = "0.22"
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls", "stream"] }
rmcp = { version = "=3.9.0", features = ["server", "transport-io", "macros"] }
schemars = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "net", "sync", "process", "io-util", "time"] }
url = "2"

[dev-dependencies]
axum = "0.8.9"

[lints.clippy]
all = "deny"
